version: 1
cases:
  - id: policy_in_scope_allow_email_openai_001
    path: policy_cases/apps/openai_email.py
    policy: policy_cases/policies/allow_email_openai.yml
    partition: in_scope
    family: allow
    description: OpenAI email flow is compliant under an explicit allow rule.
    expected: {status: compliant, categories: [EMAIL], action: allow, provider: openai, trust_zone: external}
    tags: [allow, openai, external, email]
