name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src/piiflow benchmarks
      - run: uv run pytest --cov=piiflow --cov-report=term-missing --cov-fail-under=90
      - run: uv run python benchmarks/run.py --partition all --system all
      - run: uv run python benchmarks/run_policy.py --system all
      - name: Verify benchmark hashes and metrics
        run: uv run python benchmarks/verify_release.py
      - run: uv build
      - name: Wheel smoke test
        run: |
          smoke_env="$RUNNER_TEMP/piiflow-wheel-smoke"
          uv venv "$smoke_env"
          uv pip install --python "$smoke_env/bin/python" dist/piiflow-0.3.0-py3-none-any.whl
          "$smoke_env/bin/piiflow" scan --help
          "$smoke_env/bin/piiflow" scan examples/safe_app
          if "$smoke_env/bin/piiflow" scan examples/vulnerable_app; then exit 1; else test "$?" -eq 1; fi
          "$smoke_env/bin/piiflow" scan examples/policy_apps/redacted_email.py --policy examples/policies/sanitized_email.yml
          if "$smoke_env/bin/piiflow" scan examples/policy_apps/wrong_email_sanitizer.py --policy examples/policies/sanitized_email.yml; then exit 1; else test "$?" -eq 1; fi
          "$smoke_env/bin/piiflow" scan examples/policy_apps/redacted_email.py --policy examples/policies/sanitized_email.yml --format json --output "$RUNNER_TEMP/piiflow-policy.json"
          printf "version: 1\ndefault_action: maybe\nrules: []\n" > "$RUNNER_TEMP/bad-policy.yml"
          if "$smoke_env/bin/piiflow" scan examples/safe_app --policy "$RUNNER_TEMP/bad-policy.yml"; then exit 1; else test "$?" -eq 2; fi
          "$smoke_env/bin/python" -c "from piiflow.config import load_config; import piiflow; assert piiflow.__version__ == '0.3.0'; assert load_config().version == 1"
      - name: Inspect artifacts
        run: |
          python -m zipfile --list dist/piiflow-0.3.0-py3-none-any.whl
          tar -tf dist/piiflow-0.3.0.tar.gz
          ! python -m zipfile --list dist/piiflow-0.3.0-py3-none-any.whl | grep -E 'tests/|benchmarks/|\.venv|\.tmp|\.coverage|dist/'
          ! tar -tf dist/piiflow-0.3.0.tar.gz | grep -E '\.venv|\.tmp|\.coverage|\.uv-cache|benchmarks/results|/dist/'

  windows-cli-smoke:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --extra dev
      - name: CLI examples
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::InputEncoding = [System.Text.UTF8Encoding]::new($false)

          function Invoke-ExpectedExit {
            param(
              [Parameter(Mandatory = $true)][string] $Name,
              [Parameter(Mandatory = $true)][int] $ExpectedExitCode,
              [Parameter(Mandatory = $true)][scriptblock] $Command
            )
            & $Command
            $actual = $LASTEXITCODE
            if ($null -eq $actual) { $actual = 0 }
            if ($actual -ne $ExpectedExitCode) {
              Write-Host "::error title=$Name exit code mismatch::expected $ExpectedExitCode, actual $actual"
              exit 1
            }
            Write-Host "$Name exit code $actual as expected"
          }

          Invoke-ExpectedExit "safe app" 0 {
            uv run piiflow scan examples/safe_app
          }
          Invoke-ExpectedExit "vulnerable app" 1 {
            uv run piiflow scan examples/vulnerable_app
          }
          Invoke-ExpectedExit "compliant redacted-email policy flow" 0 {
            uv run piiflow scan examples/policy_apps/redacted_email.py --policy examples/policies/sanitized_email.yml
          }
          Invoke-ExpectedExit "wrong-sanitizer policy violation" 1 {
            uv run piiflow scan examples/policy_apps/wrong_email_sanitizer.py --policy examples/policies/sanitized_email.yml
          }
          Invoke-ExpectedExit "local financial allow flow" 0 {
            uv run piiflow scan examples/policy_apps/local_financial.py --config examples/policy_apps/local_rules.yml --policy examples/policies/local_model.yml
          }

          $badPolicy = Join-Path $env:RUNNER_TEMP "bad-policy.yml"
          Set-Content -Path $badPolicy -Encoding utf8 -Value "version: 1`ndefault_action: maybe`nrules: []`n"
          Invoke-ExpectedExit "malformed policy" 2 {
            uv run piiflow scan examples/safe_app --policy $badPolicy
          }
          exit 0
